name: Continue Inheritance 003
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Rounds to advance (1–96; default 12)'
        required: false
        default: '12'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inheritance-study
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      advanced: ${{ steps.study.outputs.advanced }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: status
        name: Check whether the chapter is complete
        run: node -e "const fs=require('fs');const p=require('./data/inheritance/observatory.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'active='+(p.round<p.config.maxRounds)+'\n');"
      - if: steps.status.outputs.active == 'true'
        run: npm test
      - id: study
        if: steps.status.outputs.active == 'true'
        name: Resume saved models and matched controls
        env:
          STUDY_ROUNDS: ${{ inputs.rounds || '12' }}
        run: node scripts/advance-inheritance.mjs
      - name: Archive the complete segment before publishing
        if: steps.study.outputs.advanced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.study.outputs.archive }}
          TAG: ${{ steps.study.outputs.tag }}
        run: |
          node -e "const fs=require('fs');const w=require('./data/inheritance/observatory.json');const c=w.chapters.at(-1);fs.writeFileSync('research/inheritance-notes.md','Inheritance 003, protocol 1. Segment '+w.segment+'.\n\nRounds '+c.fromRound+'–'+c.toRound+'.\n\nParent checkpoint: '+c.parentHash+'\n\nResult checkpoint: '+c.checkpointHash+'\n\nThree paired seeds, three arms, matched dense neural computation. Includes full states, offspring weights, measurements, source and checksums.');"
          gh release create "$TAG" "$ARCHIVE" --target "$GITHUB_SHA" --title "Inheritance segment $TAG" --notes-file research/inheritance-notes.md
      - name: Commit checkpoint and public evidence together
        if: steps.study.outputs.advanced == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inheritance/checkpoint.json data/inheritance/observatory.json
          git commit -m "Continue Inheritance from saved neural weights"
          git push origin HEAD:main
  publish:
    needs: continue
    if: needs.continue.outputs.advanced == 'true'
    uses: ./.github/workflows/pages.yml
