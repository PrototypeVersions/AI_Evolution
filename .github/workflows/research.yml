name: Archived baseline comparison (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - name: Run fixed protocol on a fresh seed block
        env:
          CAMPAIGN: ${{ github.run_number }}
        run: node scripts/research.mjs --campaign "$CAMPAIGN"
      - name: Archive reproducible dataset as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -e "process.stdout.write(require('./data/published.json').id)")
          ARCHIVE="$RUNNER_TEMP/$TAG.tar.gz"
          node scripts/archive.mjs "$ARCHIVE"
          node -e "const fs=require('fs');const r=require('./data/published.json');fs.writeFileSync('research/release-notes.md', '# Research dataset\n\n'+r.runCount+' trials under '+r.protocol.id+'.\n\n'+r.assessment.status+': '+r.assessment.text+'\n\nArchive includes complete traces, trial ledger, protocol, source, and derived outcomes. This is a baseline simulation, not an LLM experiment.');"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ARCHIVE" --target "$GITHUB_SHA" --title "Research dataset $TAG" --notes-file research/release-notes.md
          fi
      - name: Publish derived report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Publish daily replication report"
          git push origin HEAD:main
  publish:
    needs: research
    uses: ./.github/workflows/pages.yml

