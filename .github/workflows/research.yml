name: Daily research and report
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - name: Run fixed protocol on a fresh seed block
        env:
          CAMPAIGN: ${{ github.run_number }}
        run: node scripts/research.mjs --campaign "$CAMPAIGN"
      - name: Preserve complete research archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-${{ github.run_number }}
          path: |
            research/
            src/
            scripts/research.mjs
            docs/
          retention-days: 90
      - name: Publish derived report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Publish daily replication report"
          git push origin HEAD:main
  publish:
    needs: research
    uses: ./.github/workflows/pages.yml

